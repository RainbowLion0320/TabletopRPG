facts:
  - { id: F01, category: truth, scope: dm, immutable: true, statement: 埃里克·摩勒参与毒品运输，并被同伙绑架在扶桑花号上。 }
  - { id: F02, category: truth, scope: dm, immutable: true, statement: 洛夫·蒙特利尔与埃里克私下勾连，并会阻挠调查。 }
  - { id: F03, category: truth, scope: dm, immutable: true, statement: 深潜者混种藏身卡森其药店，并计划于7月14日乘船离开。 }
  - { id: F04, category: testimony, scope: player, statement: 埃里克于7月10日失踪，警方没有取得进展。 }
  - { id: F05, category: evidence, scope: player, statement: 合影显示蒙特利尔与埃里克关系异常密切。 }
  - { id: F06, category: evidence, scope: player, statement: 小册子的隐写内容指向贝尔街14号卡森其药店。 }
  - { id: F07, category: evidence, scope: player, statement: 白色粉末经医学分析可确认是高纯度鸦片。 }
  - { id: F08, category: testimony, scope: player, statement: 老赫特酒保掌握“老鼠”线索，可提供贝尔街方向。 }
  - { id: F09, category: evidence, scope: player, statement: 地图笔记标出泰晤士港扶桑花号的停泊位置。 }
  - { id: F10, category: evidence, scope: player, statement: 雪茄头能证明埃里克近期到过卡森其药店。 }
  - { id: F11, category: threat, scope: dm, immutable: true, statement: 调查员见过蒙特利尔后，晚间到贝尔街会遭遇三名暴徒。 }
  - { id: F12, category: threat, scope: dm, immutable: true, statement: 扶桑花号战斗持续七轮后，深潜者会带船逃脱。 }
  - { id: F13, category: truth, scope: dm, immutable: true, statement: 扶桑花号的深潜者只要求带走走私货物并安全离港；若调查员承诺不追击，他们愿意释放埃里克。 }

scenes:
  - id: S01
    name: 摩勒住宅
    chapterTitle: 第一幕：接受委托
    description: 纽伦上街101-102号的维多利亚式别墅，伊莎贝拉·摩勒在此等待调查员。
    aliases: [摩勒家, 住宅, 别墅]
    assetId: scene.S01
    npcIds: [N01]
    itemIds: [I01, I02, I03, I04, I05, I06]
    dmFactIds: [F01]
    exits:
      - { to: S02, travelMinutes: 10, when: { factKnown: F05 }, blockedText: 目前没有足够理由直接质询警察局长。 }
      - { to: S03, travelMinutes: 10, when: { variable: oldHethLead, op: eq, value: true }, blockedText: 你们还不知道老赫特酒吧与此案的联系。 }
      - { to: S04, travelMinutes: 20, when: { any: [{ factKnown: F06 }, { factKnown: F08 }] }, blockedText: 你们还没有确认贝尔街14号的具体目标。 }
  - id: S02
    name: 上城区第二分局
    chapterTitle: 第二幕：街区调查
    description: 距离摩勒住宅约十分钟路程，洛夫·蒙特利尔局长在这里办公。
    aliases: [第二分局, 警察局, 警局]
    assetId: scene.S02
    npcIds: [N03]
    itemIds: []
    dmFactIds: [F02, F11]
    exits:
      - { to: S01, travelMinutes: 10, when: { always: true }, blockedText: 无法返回摩勒住宅。 }
      - { to: S03, travelMinutes: 10, when: { variable: oldHethLead, op: eq, value: true }, blockedText: 你们还没有老赫特酒吧的线索。 }
      - { to: S04, travelMinutes: 15, when: { any: [{ factKnown: F06 }, { factKnown: F08 }] }, blockedText: 你们还没有贝尔街14号的可靠地址。 }
  - id: S03
    name: 老赫特酒吧
    chapterTitle: 第二幕：街区调查
    description: 街区内昏暗嘈杂的小酒馆，空气里弥漫着烟草和廉价酒气。
    aliases: [老赫特之家, 酒吧]
    assetId: scene.S03
    npcIds: [N04]
    itemIds: []
    dmFactIds: [F08]
    exits:
      - { to: S01, travelMinutes: 10, when: { always: true }, blockedText: 无法返回摩勒住宅。 }
      - { to: S02, travelMinutes: 10, when: { factKnown: F05 }, blockedText: 你们还没有质询蒙特利尔的依据。 }
      - { to: S04, travelMinutes: 10, when: { any: [{ factKnown: F06 }, { factKnown: F08 }] }, blockedText: 酒保还没有透露贝尔街的方向。 }
  - id: S04
    name: 卡森其药店
    chapterTitle: 第二幕：街区调查
    description: 贝尔街14号一间废弃多年的药店。非人身影撤离时已从内侧撞开后门，调查员进入店内，内部没有营业迹象。
    aliases: [药店, 药房, 废弃药店, 废弃药房, 贝尔街14号, 贝尔街十四号, 十四号]
    assetId: scene.S04
    npcIds: []
    itemIds: [I07, I08]
    dmFactIds: [F03, F11]
    exits:
      - { to: S01, travelMinutes: 20, when: { always: true }, blockedText: 无法返回摩勒住宅。 }
      - { to: S02, travelMinutes: 15, when: { always: true }, blockedText: 无法前往警局。 }
      - { to: S03, travelMinutes: 10, when: { always: true }, blockedText: 无法前往老赫特酒吧。 }
      - { to: S05, travelMinutes: 25, when: { factKnown: F09 }, blockedText: 没有地图笔记就无法在浓雾中定位扶桑花号。 }
  - id: S05
    name: 泰晤士港·扶桑花号
    chapterTitle: 终幕：扶桑花号
    description: 泰晤士港的偏僻泊位，浓雾覆盖水面，扶桑花号正准备离港。
    aliases: [泰晤士港, 港口, 码头, 码头区, 扶桑花号]
    assetId: scene.S05
    npcIds: [N05, N02]
    itemIds: []
    dmFactIds: [F01, F03, F12, F13]
    exits:
      - { to: S04, travelMinutes: 25, when: { not: { encounter: ENC01, state: active } }, blockedText: 遭遇尚未解决，无法安全离开。 }

