variables:
  - { id: commissionAccepted, type: boolean, default: false }
  - { id: oldHethLead, type: boolean, default: false }
  - { id: metMontreal, type: boolean, default: false }
  - { id: hybridEscaped, type: boolean, default: false }
  - { id: thugAlert, type: boolean, default: false }
  - { id: finaleRoute, type: string, default: undecided }
  - { id: combatRoundStarted, type: boolean, default: false }
  - { id: ericRescued, type: boolean, default: false }

acts:
  - { id: A01, title: 第一幕：接受委托, order: 1 }
  - { id: A02, title: 第二幕：街区调查, order: 2 }
  - { id: A03, title: 终幕：扶桑花号, order: 3 }

objectives:
  - { id: O01, beatId: B01, title: 接受委托, playerText: 与伊莎贝拉确认委托和埃里克失踪的基本情况。, required: true }
  - { id: O02, beatId: B02, title: 找到下一处调查方向, playerText: 在摩勒住宅寻找能指向下一处调查地点的证据。, required: true }
  - { id: O03, beatId: B03, title: 质询蒙特利尔, playerText: 调查蒙特利尔与埃里克的关系并观察他的反应。, required: false }
  - { id: O04, beatId: B04, title: 获取“老鼠”情报, playerText: 说服老赫特酒保透露贝尔街相关消息。, required: false }
  - { id: O05, beatId: B05, title: 调查卡森其药店, playerText: 应对浓雾与追兵，找到扶桑花号的位置。, required: true }
  - { id: O06, beatId: B06, title: 决定终幕路线, playerText: 在扶桑花号上选择阻止深潜者或尝试交涉。, required: true }
  - { id: O07, beatId: B06, title: 阻止扶桑花号离港, playerText: 在七轮内结束冲突并救出埃里克。, required: false }
  - { id: O08, beatId: B06, title: 完成交涉, playerText: 先听懂对方诉求，再说服其释放埃里克。, required: false }

beats:
  - id: B01
    actId: A01
    title: 伊莎贝拉的委托
    kind: mandatory
    sceneIds: [S01]
    activation: { always: true }
    completion: { variable: commissionAccepted, op: eq, value: true }
    objectiveIds: [O01]
    dmFactIds: [F01, F04]
    allowedEventIds: [EV_ACCEPT_COMMISSION, EV_OPENING_RECOVERY]
    softEscalationAfter: 3
    hardRecoveryAfter: 6
    softPrompt: 伊莎贝拉主动说明父亲失踪日期、警方无进展和父亲常去老赫特酒吧。
    recoveryEventId: EV_OPENING_RECOVERY
    nextBeatIds: [B02]
  - id: B02
    actId: A01
    title: 摩勒住宅调查
    kind: mandatory
    sceneIds: [S01]
    activation: { beat: B01, status: completed }
    completion: { any: [{ factKnown: F05 }, { factKnown: F06 }, { factKnown: F08 }] }
    objectiveIds: [O02]
    dmFactIds: [F01, F02]
    allowedEventIds: [EV_FIND_I01, EV_FAIL_I01, EV_FIND_I02, EV_FAIL_I02, EV_FIND_I03, EV_DISCOVER_I04, EV_FAIL_I04, EV_FIND_I04, EV_FIND_I05, EV_FAIL_I05, EV_FIND_I06, EV_FAIL_I06, EV_HOUSE_RECOVERY, EV_RECOVER_I01, EV_RECOVER_I02, EV_RECOVER_I03, EV_RECOVER_I04, EV_RECOVER_I05, EV_RECOVER_I06]
    softEscalationAfter: 3
    hardRecoveryAfter: 6
    softPrompt: 从书桌抽屉、书架夹缝、垃圾桶或车库暗格中选择一处给出明确可调查迹象。
    recoveryEventId: EV_HOUSE_RECOVERY
    nextBeatIds: [B03, B04, B05]
  - id: B03
    actId: A02
    title: 警局支线
    kind: optional
    sceneIds: [S02]
    activation: { factKnown: F05 }
    completion: { variable: metMontreal, op: eq, value: true }
    objectiveIds: [O03]
    dmFactIds: [F02, F11]
    allowedEventIds: [EV_MEET_MONTREAL]
    softEscalationAfter: 0
    hardRecoveryAfter: 0
    softPrompt: 蒙特利尔保持强硬和回避，不主动承认犯罪事实。
    recoveryEventId: ""
    nextBeatIds: [B04, B05]
  - id: B04
    actId: A02
    title: 老赫特酒吧支线
    kind: optional
    sceneIds: [S03]
    activation: { variable: oldHethLead, op: eq, value: true }
    completion: { factKnown: F08 }
    objectiveIds: [O04]
    dmFactIds: [F08]
    allowedEventIds: [EV_BARTENDER_RAT]
    softEscalationAfter: 0
    hardRecoveryAfter: 0
    softPrompt: 酒保只在获得酒水、金钱或可信理由后提供“老鼠”线索。
    recoveryEventId: ""
    nextBeatIds: [B05]
  - id: B05
    actId: A02
    title: 卡森其药店
    kind: mandatory
    sceneIds: [S04]
    activation: { any: [{ factKnown: F06 }, { factKnown: F08 }] }
    completion: { factKnown: F09 }
    objectiveIds: [O05]
    dmFactIds: [F03, F09, F10, F11]
    allowedEventIds: [EV_S04_FOG, EV_S04_MAP, EV_FAIL_I07, EV_S04_CIGAR, EV_FAIL_I08, EV_S04_THUGS, EV_PHARMACY_RECOVERY, EV_RECOVER_I07, EV_RECOVER_I08]
    softEscalationAfter: 3
    hardRecoveryAfter: 6
    softPrompt: 浓雾加重，后厅油布包和柜台附近的痕迹变得更显眼。
    recoveryEventId: EV_PHARMACY_RECOVERY
    nextBeatIds: [B06]
  - id: B06
    actId: A03
    title: 扶桑花号终幕
    kind: finale
    sceneIds: [S05]
    activation: { factKnown: F09 }
    completion: { any: [{ encounter: ENC01, state: won }, { eventFired: EV_NEGOTIATION_SUCCESS }, { clock: fusangEscape, op: gte, value: 7 }] }
    objectiveIds: [O06, O07, O08]
    dmFactIds: [F01, F03, F12, F13]
    allowedEventIds: [EV_CHOOSE_COMBAT, EV_CHOOSE_NEGOTIATION, EV_COMBAT_ATTACK, EV_COMBAT_HIT, EV_COMBAT_ROUND, EV_COMBAT_WIN, EV_NEGOTIATION_LISTEN, EV_NEGOTIATION_UNDERSTOOD, EV_NEGOTIATION_LISTEN_FAILED, EV_NEGOTIATION_SUCCESS, EV_NEGOTIATION_FAILED, EV_RESCUE_ERIC]
    softEscalationAfter: 3
    hardRecoveryAfter: 6
    softPrompt: 船笛和收缆声提醒调查员，扶桑花号即将离港，必须立刻选择行动路线。
    recoveryEventId: EV_CHOOSE_COMBAT
    nextBeatIds: []

storyEvents:
  - id: EV_ACCEPT_COMMISSION
    beatId: B01
    title: 接受委托
    trigger: manual
    when: { sceneIs: S01 }
    effects: [{ setVariable: commissionAccepted, value: true }, { setVariable: oldHethLead, value: true }, { revealFact: F04 }, { completeObjective: O01 }, { completeBeat: B01 }, { activateBeat: B02 }]
    once: true
    playerVisible: true
    narrativeCue: 伊莎贝拉确认委托，并提供父亲失踪日期、警方无进展以及老赫特酒吧这一生活线索。
  - id: EV_OPENING_RECOVERY
    beatId: B01
    title: 委托回收
    trigger: automatic
    when: { variable: commissionAccepted, op: eq, value: false }
    effects: [{ setVariable: commissionAccepted, value: true }, { setVariable: oldHethLead, value: true }, { revealFact: F04 }, { completeObjective: O01 }, { completeBeat: B01 }, { activateBeat: B02 }, { advanceTime: 10 }]
    once: true
    playerVisible: true
    narrativeCue: 伊莎贝拉提高酬金并把父亲常去老赫特酒吧的情况写入委托资料，调查正式开始。
  - { id: EV_FIND_I01, beatId: B02, title: 发现便签, trigger: manual, when: { sceneIs: S01 }, effects: [{ discoverClue: I01 }], once: true, playerVisible: true, narrativeCue: 调查员发现写有“别来找我”的便签。 }
  - { id: EV_FAIL_I01, beatId: B02, title: 失败推进·便签, trigger: manual, when: { sceneIs: S01 }, effects: [{ discoverClue: I01 }, { advanceTime: 5 }], once: true, playerVisible: true, narrativeCue: 虽然没能判断笔触异常，调查员仍看清便签上的“别来找我”，但耽误了五分钟。 }
  - { id: EV_FIND_I02, beatId: B02, title: 发现合影, trigger: manual, when: { sceneIs: S01 }, effects: [{ discoverClue: I02 }, { revealFact: F05 }], once: true, playerVisible: true, narrativeCue: 合影把埃里克与蒙特利尔联系起来，警局成为合法调查方向。 }
  - { id: EV_FAIL_I02, beatId: B02, title: 失败推进·合影, trigger: manual, when: { sceneIs: S01 }, effects: [{ discoverClue: I02 }, { revealFact: F05 }, { advanceTime: 10 }], once: true, playerVisible: true, narrativeCue: 翻找声惊动了伊莎贝拉，但她仍认出合影中的蒙特利尔；调查因此耽误十分钟。 }
  - { id: EV_FIND_I03, beatId: B02, title: 发现名片, trigger: manual, when: { sceneIs: S01 }, effects: [{ discoverClue: I03 }], once: true, playerVisible: true, narrativeCue: 调查员收起埃里克旧公司的名片。 }
  - { id: EV_DISCOVER_I04, beatId: B02, title: 发现小册子, trigger: manual, when: { sceneIs: S01 }, effects: [{ discoverClue: I04 }], once: true, playerVisible: true, narrativeCue: 调查员在书架夹缝中发现夹页受过特殊处理的小册子，但尚未读出隐藏内容。 }
  - { id: EV_FAIL_I04, beatId: B02, title: 失败推进·小册子, trigger: manual, when: { sceneIs: S01 }, effects: [{ discoverClue: I04 }, { advanceTime: 15 }], once: true, playerVisible: true, narrativeCue: 调查员仍找到受潮的小册子，却没能读出隐藏内容；反复翻找耽误十五分钟。 }
  - { id: EV_FIND_I04, beatId: B02, title: 破译小册子, trigger: manual, when: { clue: I04, status: discovered }, effects: [{ analyzeClue: I04 }, { revealFact: F06 }, { setVariable: oldHethLead, value: true }], once: true, playerVisible: true, narrativeCue: 加热显出隐写文字“贝尔街14号卡森其药店”，同时强化了老赫特这一街区线索。 }
  - { id: EV_FIND_I05, beatId: B02, title: 发现粉末样品, trigger: manual, when: { sceneIs: S01 }, effects: [{ discoverClue: I05 }, { analyzeClue: I05 }, { revealFact: F07 }], once: true, playerVisible: true, narrativeCue: 医学分析确认暗格中的白色粉末是高纯度鸦片。 }
  - { id: EV_FAIL_I05, beatId: B02, title: 失败推进·粉末, trigger: manual, when: { sceneIs: S01 }, effects: [{ discoverClue: I05 }, { advanceTime: 10 }], once: true, playerVisible: true, narrativeCue: 艾达只能确认白色粉末样品十分可疑，无法立即定性；检查耽误十分钟。 }
  - { id: EV_FIND_I06, beatId: B02, title: 发现报纸残片, trigger: manual, when: { sceneIs: S01 }, effects: [{ discoverClue: I06 }], once: true, playerVisible: true, narrativeCue: 报纸残片保留着蒙特利尔的扫毒英雄通稿，可与合影交叉比对。 }
  - { id: EV_FAIL_I06, beatId: B02, title: 失败推进·报纸, trigger: manual, when: { sceneIs: S01 }, effects: [{ discoverClue: I06 }], once: true, playerVisible: true, narrativeCue: 调查员仍带走了破损严重的报纸残片，人物照片需要之后与合影比对。 }
  - id: EV_HOUSE_RECOVERY
    beatId: B02
    title: 住宅主线回收
    trigger: automatic
    when: { not: { factKnown: F06 } }
    effects: [{ discoverClue: I04 }, { analyzeClue: I04 }, { revealFact: F06 }, { setVariable: oldHethLead, value: true }, { advanceTime: 15 }]
    once: true
    playerVisible: true
    narrativeCue: 伊莎贝拉整理父亲遗物时发现小册子受热显字，代价是调查耗去了额外时间。
  - { id: EV_RECOVER_I01, beatId: B02, title: 恢复便签, trigger: automatic, when: { clue: I01, status: destroyed }, effects: [{ discoverClue: I01 }, { advanceTime: 5 }], once: true, playerVisible: true, narrativeCue: 调查员从残留纸片中恢复了便签正文。 }
  - { id: EV_RECOVER_I02, beatId: B02, title: 恢复合影, trigger: automatic, when: { clue: I02, status: destroyed }, effects: [{ revealFact: F05 }, { advanceTime: 10 }], once: true, playerVisible: true, narrativeCue: 伊莎贝拉确认照片上的另一人是蒙特利尔。 }
  - { id: EV_RECOVER_I03, beatId: B02, title: 恢复名片, trigger: automatic, when: { clue: I03, status: destroyed }, effects: [{ discoverClue: I03 }], once: true, playerVisible: true, narrativeCue: 伊莎贝拉从通讯录中抄出名片上的旧公司信息。 }
  - { id: EV_RECOVER_I04, beatId: B02, title: 恢复小册子线索, trigger: automatic, when: { clue: I04, status: destroyed }, effects: [{ revealFact: F06 }, { setVariable: oldHethLead, value: true }, { advanceTime: 15 }], once: true, playerVisible: true, narrativeCue: 烧剩的夹页仍留下“贝尔14”字样，足以继续调查。 }
  - { id: EV_RECOVER_I05, beatId: B02, title: 恢复粉末证据, trigger: automatic, when: { clue: I05, status: destroyed }, effects: [{ revealFact: F07 }, { advanceTime: 10 }], once: true, playerVisible: true, narrativeCue: 暗格残留物仍能证明这里存放过鸦片。 }
  - { id: EV_RECOVER_I06, beatId: B02, title: 恢复报纸信息, trigger: automatic, when: { clue: I06, status: destroyed }, effects: [{ setVariable: metMontreal, value: true }], once: true, playerVisible: true, narrativeCue: 伊莎贝拉认出残片上的人物是蒙特利尔。 }
  - id: EV_MEET_MONTREAL
    beatId: B03
    title: 蒙特利尔阻挠调查
    trigger: manual
    when: { sceneIs: S02 }
    effects: [{ setVariable: metMontreal, value: true }, { setVariable: thugAlert, value: true }, { completeObjective: O03 }, { completeBeat: B03 }, { advanceTime: 15 }]
    once: true
    playerVisible: true
    narrativeCue: 蒙特利尔回避关键问题，并冷淡地结束了会面。
  - id: EV_BARTENDER_RAT
    beatId: B04
    title: 酒保提供“老鼠”线索
    trigger: manual
    when: { sceneIs: S03 }
    effects: [{ revealFact: F08 }, { completeObjective: O04 }, { completeBeat: B04 }, { activateBeat: B05 }, { advanceTime: 10 }]
    once: true
    playerVisible: true
    narrativeCue: 酒保在得到酒水、金钱或可信理由后，指出贝尔街14号的废弃药店。
  - id: EV_S04_FOG
    beatId: B05
    title: 深潜者撤离与浓雾
    trigger: sceneEnter
    when: { sceneIs: S04 }
    effects: [{ setVariable: hybridEscaped, value: true }, { applyDelta: san, target: party, value: -1 }, { advanceTime: 10 }]
    once: true
    playerVisible: true
    narrativeCue: 非人的身影从内侧撞开后门撤离，调查员随即进入药店；咒术浓雾在店内涌动，所有在场调查员承受最低1点SAN损失。
  - id: EV_S04_MAP
    beatId: B05
    title: 获得地图笔记
    trigger: manual
    when: { sceneIs: S04 }
    effects: [{ discoverClue: I07 }, { analyzeClue: I07 }, { revealFact: F09 }, { completeObjective: O05 }, { completeBeat: B05 }, { activateBeat: B06 }]
    once: true
    playerVisible: true
    narrativeCue: 后厅油布包中的地图笔记标出了泰晤士港扶桑花号的位置。
  - { id: EV_FAIL_I07, beatId: B05, title: 失败推进·地图, trigger: manual, when: { sceneIs: S04 }, effects: [{ discoverClue: I07 }, { analyzeClue: I07 }, { revealFact: F09 }, { completeObjective: O05 }, { completeBeat: B05 }, { activateBeat: B06 }, { setVariable: thugAlert, value: true }, { advanceTime: 10 }], once: true, playerVisible: true, narrativeCue: 地图笔记虽被水浸坏，残片仍能定位泰晤士港扶桑花号；敌人警觉且调查耽误十分钟。 }
  - { id: EV_S04_CIGAR, beatId: B05, title: 发现雪茄头, trigger: manual, when: { sceneIs: S04 }, effects: [{ discoverClue: I08 }, { analyzeClue: I08 }, { revealFact: F10 }], once: true, playerVisible: true, narrativeCue: 雪茄头与埃里克常用品牌一致，证明他近期来过药店。 }
  - { id: EV_FAIL_I08, beatId: B05, title: 失败推进·雪茄, trigger: manual, when: { sceneIs: S04 }, effects: [{ discoverClue: I08 }], once: true, playerVisible: true, narrativeCue: 调查员仍收起雪茄头，但暂时无法辨认品牌，需与埃里克的物品比对。 }
  - id: EV_S04_THUGS
    beatId: B05
    title: 暴徒抵达贝尔街
    trigger: automatic
    when: { all: [{ sceneIs: S04 }, { variable: metMontreal, op: eq, value: true }, { worldTime: true, op: gte, value: 1920-07-13T19:00 }] }
    effects: [{ resolveEncounter: ENC02, state: resolved }]
    once: true
    playerVisible: true
    narrativeCue: 三名身份不明的暴徒追到贝尔街，短暂封住药店外的退路后消失在浓雾中。
  - { id: EV_PHARMACY_RECOVERY, beatId: B05, title: 药店主线回收, trigger: automatic, when: { not: { factKnown: F09 } }, effects: [{ discoverClue: I07 }, { analyzeClue: I07 }, { revealFact: F09 }, { completeObjective: O05 }, { completeBeat: B05 }, { activateBeat: B06 }, { advanceTime: 15 }], once: true, playerVisible: true, narrativeCue: 即使地图受损，水渍和船名残片仍足以定位扶桑花号，但敌人获得了额外准备时间。 }
  - { id: EV_RECOVER_I07, beatId: B05, title: 恢复港口位置, trigger: automatic, when: { clue: I07, status: destroyed }, effects: [{ revealFact: F09 }, { advanceTime: 15 }], once: true, playerVisible: true, narrativeCue: 地图残片与港口灯号相互印证，恢复了扶桑花号泊位。 }
  - { id: EV_RECOVER_I08, beatId: B05, title: 恢复雪茄证据, trigger: automatic, when: { clue: I08, status: destroyed }, effects: [{ revealFact: F10 }], once: true, playerVisible: true, narrativeCue: 柜台残留的烟灰品牌仍能与埃里克的雪茄盒对应。 }
  - id: EV_CHOOSE_COMBAT
    beatId: B06
    title: 选择战斗路线
    trigger: manual
    when: { all: [{ sceneIs: S05 }, { variable: finaleRoute, op: eq, value: undecided }] }
    effects: [{ setVariable: finaleRoute, value: combat }, { setVariable: combatRoundStarted, value: true }, { completeObjective: O06 }, { activateObjective: O07 }, { startEncounter: ENC01, route: combat }, { startClock: fusangEscape, value: 0, visible: true }, { requestCheck: CHECK_COMBAT, skill: 格斗（拳）, difficulty: 普通, reason: 以第一次攻击正式打响甲板战斗 }]
    once: true
    playerVisible: true
    narrativeCue: 调查员以武力阻止深潜者，扶桑花号逃脱时钟开始计数；第一次攻击需要通过对应的战斗技能检定结算。
  - id: EV_CHOOSE_NEGOTIATION
    beatId: B06
    title: 选择交涉路线
    trigger: manual
    when: { all: [{ sceneIs: S05 }, { variable: finaleRoute, op: eq, value: undecided }] }
    effects: [{ setVariable: finaleRoute, value: negotiation }, { completeObjective: O06 }, { activateObjective: O08 }, { requestCheck: CHECK_LISTEN, skill: 聆听, difficulty: 普通, reason: 从非人声调中辨认其真正诉求 }]
    once: true
    playerVisible: true
    narrativeCue: 调查员暂缓攻击，与扶桑花号交涉代表保持距离，尝试听懂深潜者的诉求。
  - id: EV_COMBAT_ROUND
    beatId: B06
    title: 战斗轮推进
    trigger: turnEnd
    when: { all: [{ variable: finaleRoute, op: eq, value: combat }, { variable: combatRoundStarted, op: eq, value: true }, { encounter: ENC01, state: active }] }
    effects: [{ updateEncounter: ENC01, field: round, amount: 1 }, { tickClock: fusangEscape, amount: 1 }]
    once: false
    playerVisible: true
    narrativeCue: 船员继续收缆，扶桑花号距离逃脱又近一轮。
  - id: EV_COMBAT_ATTACK
    beatId: B06
    title: 攻击深潜者
    trigger: manual
    when: { all: [{ variable: finaleRoute, op: eq, value: combat }, { encounter: ENC01, state: active }, { clock: fusangEscape, op: lt, value: 7 }] }
    effects: [{ setVariable: combatRoundStarted, value: true }, { requestCheck: CHECK_COMBAT, skill: 格斗（拳）, difficulty: 普通, reason: 在甲板混战中使一名深潜者失去战斗能力 }]
    once: false
    playerVisible: true
    narrativeCue: 调查员抓住机会攻击一名仍在抵抗的深潜者。
  - id: EV_COMBAT_HIT
    beatId: B06
    title: 有效命中深潜者
    trigger: checkResolved
    when: { all: [{ check: CHECK_COMBAT, outcome: success }, { encounter: ENC01, state: active }] }
    effects: [{ updateEncounter: ENC01, field: opponentHp, amount: -11 }, { updateEncounter: ENC01, field: defeated, amount: 1 }]
    once: false
    playerVisible: true
    narrativeCue: 攻击奏效，一名深潜者失去战斗能力。
  - id: EV_COMBAT_WIN
    beatId: B06
    title: 击败深潜者
    trigger: automatic
    when: { all: [{ variable: finaleRoute, op: eq, value: combat }, { encounter: ENC01, field: opponentHp, op: lte, value: 0 }, { clock: fusangEscape, op: lt, value: 7 }] }
    effects: [{ resolveEncounter: ENC01, state: won }, { completeObjective: O07 }, { setVariable: ericRescued, value: true }, { stopClock: fusangEscape }, { setEnding: END_A }]
    once: true
    playerVisible: true
    narrativeCue: 四名深潜者失去战斗能力，调查员及时救出埃里克。
  - id: EV_NEGOTIATION_LISTEN
    beatId: B06
    title: 听懂深潜者诉求
    trigger: manual
    when: { variable: finaleRoute, op: eq, value: negotiation }
    effects: [{ requestCheck: CHECK_LISTEN, skill: 聆听, difficulty: 普通, reason: 从非人声调中辨认其真正诉求 }]
    once: false
    playerVisible: true
    narrativeCue: 调查员需要先通过聆听检定理解对方的真正诉求。
  - id: EV_NEGOTIATION_UNDERSTOOD
    beatId: B06
    title: 理解深潜者诉求
    trigger: checkResolved
    when: { check: CHECK_LISTEN, outcome: success }
    effects: [{ revealFact: F13 }, { requestCheck: CHECK_PERSUADE, skill: 说服, difficulty: 困难, reason: 说服深潜者释放埃里克并和平离开 }]
    once: false
    playerVisible: true
    narrativeCue: 调查员听懂了深潜者的底线：他们只要求带走走私货物并安全离港；若调查员承诺不追击，他们愿意释放埃里克。现在必须完成说服。
  - id: EV_NEGOTIATION_LISTEN_FAILED
    beatId: B06
    title: 失败推进·交涉聆听
    trigger: checkResolved
    when: { any: [{ check: CHECK_LISTEN, outcome: fail }, { check: CHECK_LISTEN, outcome: fumble }] }
    effects: [{ revealFact: F13 }, { advanceTime: 5 }, { requestCheck: CHECK_PERSUADE, skill: 说服, difficulty: 极难, reason: 未能听清声调，只能依据反复手势在对方失去耐心前完成交涉 }]
    once: false
    playerVisible: true
    narrativeCue: 调查员没能听清非人声调，但反复手势仍表明深潜者只要求带走走私货物并安全离港；迟疑消磨了对方耐心，仍可尝试说服其释放埃里克，但难度提高为极难。
  - id: EV_NEGOTIATION_SUCCESS
    beatId: B06
    title: 交涉成功
    trigger: checkResolved
    when: { check: CHECK_PERSUADE, outcome: success }
    effects: [{ completeObjective: O08 }, { setVariable: ericRescued, value: true }, { setEnding: END_C }]
    once: true
    playerVisible: true
    narrativeCue: 说服奏效，深潜者释放埃里克并同意和平离港。
  - id: EV_NEGOTIATION_FAILED
    beatId: B06
    title: 交涉破裂
    trigger: checkResolved
    when: { any: [{ check: CHECK_PERSUADE, outcome: fail }, { check: CHECK_PERSUADE, outcome: fumble }] }
    effects: [{ failObjective: O08 }, { setEnding: END_B }]
    once: true
    playerVisible: true
    narrativeCue: 最后的说服没有奏效，深潜者终止交涉，扶桑花号带着埃里克驶入浓雾。
  - { id: EV_RESCUE_ERIC, beatId: B06, title: 救出埃里克, trigger: automatic, when: { variable: ericRescued, op: eq, value: true }, effects: [{ revealFact: F01 }], once: true, playerVisible: true, narrativeCue: 埃里克获救，但其走私身份也随证据暴露。 }

endings:
  - id: END_A
    title: 结局A：击败深潜者
    summary: 深潜者被击败，埃里克获救，调查员阻止了扶桑花号逃脱。
    when: { all: [{ encounter: ENC01, state: won }, { variable: ericRescued, op: eq, value: true }] }
    effects: [{ applyDelta: san, target: party, value: 1d3 }, { applyDelta: money, target: party, value: 200 }, { applyDelta: mythos, target: party, value: 1d6 }]
    priority: 30
  - id: END_B
    title: 结局B：深潜者逃脱
    summary: 调查员未能及时救出埃里克，扶桑花号载着深潜者和埃里克消失在泰晤士河浓雾中。
    when: { all: [{ variable: finaleRoute, op: eq, value: combat }, { clock: fusangEscape, op: gte, value: 7 }] }
    effects: [{ resolveEncounter: ENC01, state: lost }, { stopClock: fusangEscape }, { setEnding: END_B }]
    priority: 10
  - id: END_C
    title: 结局C：和平交涉
    summary: 调查员听懂并说服深潜者释放埃里克，扶桑花号随后和平离港。
    when: { eventFired: EV_NEGOTIATION_SUCCESS }
    effects: [{ applyDelta: san, target: party, value: 1d6 }, { applyDelta: money, target: party, value: 100 }, { applyDelta: mythos, target: party, value: 1d6 }]
    priority: 20
