openingNarrative: |-
  1920年7月13日，英国伦敦。雨夜的伦敦裹在浓雾之中，煤气灯的光晕在水汽里渗散开来。你们站在纽伦上街101号的门廊下，手中握着伊莎贝拉·摩勒小姐的求助信。

  信中写道：「我父亲埃里克·摩勒于三日前失踪，警察局毫无进展。若您能找到他，必有重谢。」
initialSuggestions: [接受委托并询问失踪经过, 观察伊莎贝拉的状态, 要求查看埃里克的书房]
